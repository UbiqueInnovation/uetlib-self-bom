name: Build
on:
  push:
    branches: [ '**' ]
    tags-ignore: [ v* ]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Prepare maven
        uses: UbiqueInnovation/action-systems-mvn-prepare@v1.0.1
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Maven Install
        uses: UbiqueInnovation/action-systems-mvn-install@v1.0.1
        with:
          parent_pom: pom.xml

  test-version-bump:
    name: Test Version Bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - uetlib-job-testapp
    steps:
      - name: Checkout uetlib-self-bom repository
        uses: actions/checkout@v6

      - name: Prepare maven
        uses: UbiqueInnovation/action-systems-mvn-prepare@v1.0.1
        with:
          mvn_repository_id: ubique-artifactory
          mvn_repository_user: ${{ secrets.UB_ARTIFACTORY_USER }}
          mvn_repository_password: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
          mvn_repository_url: ${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_BACKEND }}

      - name: Create custom mvn repository settings.xml
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 # v4.0.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "${{ inputs.mvn_repository_id }}",
                "username": "${{ inputs.mvn_repository_user }}",
                "password": "${{ inputs.mvn_repository_password }}"
              }
            ]
          repositories: >-
            [
              {
                "id": "${{ inputs.mvn_repository_id }}",
                "url": "${{ inputs.mvn_repository_url }}"
              }
            ]

      - name: Build uetlib-self-bom
        run: mvn --batch-mode --settings ~/.m2/settings.xml install -DskipTests

      - name: Get uetlib-self-bom version
        id: get_version
        run: |
          VERSION=$(mvn --settings ~/.m2/settings.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "self_bom_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@v6
        with:
          repository: UbiqueInnovation/${{ matrix.repository }}
          path: ${{ matrix.repository }}
          token: ${{ secrets.WORKFLOW_PAT_GITHUB }}
          ref: main

      - name: Update uetlib-self-bom version for ${{ matrix.repository }}
        run: |
          mvn --batch-mode --settings ~/.m2/settings.xml versions:use-dep-version -DdepVersion=${{ steps.get_version.outputs.self_bom_version }} -Dincludes=ch.ubique:uetlib-self-bom -DallowSnapshots=true -f ${{ matrix.repository }}/pom.xml

      - name: Build ${{ matrix.repository }} with Maven
        run: mvn --batch-mode --settings ~/.m2/settings.xml --update-snapshots install -f ${{ matrix.repository }}/pom.xml