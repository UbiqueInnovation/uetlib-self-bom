name: Build
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build Project
    permissions:
      contents: read
    uses: UbiqueInnovation/uetlib/.github/workflows/mvn-install.yml@8e735f5276f25dd3e279fff24a4ed959f4a58c69 # v1.2.0
    with:
      sonar: true
    secrets:
      SONAR_TOKEN: ${{ secrets.UETLIB_SONAR_TOKEN }}
      UB_ARTIFACTORY_USER: ${{ secrets.UB_ARTIFACTORY_USER }}
      UB_ARTIFACTORY_PASSWORD: ${{ secrets.UB_ARTIFACTORY_PASSWORD }}
      UB_ARTIFACTORY_URL: ${{ secrets.UB_ARTIFACTORY_URL }}
      UB_ARTIFACTORY_REPO_UBIQUE: ${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}
      SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC: ${{ secrets.SYSTEMS_UBIQUE_SIGNING_KEY_ARMOR_ASC }}
      SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE: ${{ secrets.SYSTEMS_UBIQUE_SIGNING_KEY_PASSPHRASE }}


  test-version-bump:
    name: Test Version Bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - uetlib-testapp
    steps:
      - name: Checkout uetlib-self-bom repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'
          # Pull request builds resolve without Artifactory and use their own Maven cache below.
          cache: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && 'maven' || '' }}
          overwrite-settings: false

      - name: Cache Maven repository for pull requests
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-pr-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-pr-${{ runner.os }}-

      - name: Create custom mvn repository settings.xml
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # v4.1.0
        with:
          githubServer: false
          servers: >-
            [
              {
                "id": "ubique-artifactory-virtual",
                "username": "${{ secrets.UB_ARTIFACTORY_USER }}",
                "password": "${{ secrets.UB_ARTIFACTORY_PASSWORD }}"
              }
            ]
          repositories: |
            [
              {
                "id": "ubique-artifactory-virtual",
                "url": "${{ secrets.UB_ARTIFACTORY_URL }}${{ secrets.UB_ARTIFACTORY_REPO_UBIQUE }}"
              }
            ]

      - name: Build uetlib-self-bom
        run: mvn --batch-mode install -DskipTests

      - name: Get uetlib-self-bom version
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "self_bom_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UbiqueInnovation/${{ matrix.repository }}
          path: ${{ matrix.repository }}
          persist-credentials: false
          ref: main

      - name: Update uetlib-self-bom version for ${{ matrix.repository }}
        run: |
          mvn --batch-mode versions:use-dep-version -DdepVersion=${{ steps.get_version.outputs.self_bom_version }} -Dincludes=ch.uetlib:uetlib-self-bom -DallowSnapshots=true -f ${{ matrix.repository }}/pom.xml

      - name: Build ${{ matrix.repository }} with Maven
        run: mvn --batch-mode --update-snapshots install -f ${{ matrix.repository }}/pom.xml
